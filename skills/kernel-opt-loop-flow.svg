<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Kernel Opt Skill 优化闭环</title>
  <desc id="desc">展示 kernel-opt-loop 从 Phase 0 初始化到 Designer、Coder、Verifier、Orchestrator，再由策略评估决定继续、停止或阻塞恢复的流程图。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12324a"/>
      <stop offset="1" stop-color="#1f6072"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315a72"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#247a5a"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b54747"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #d8edf0; }
      .section { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .box-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .box-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #365466; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #557184; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #315a72; }
      .rule-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .rule-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #e7f4f3; }
      .stop-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7e3232; }
      .stop-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #754848; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#f5f8fa"/>
  <rect x="0" y="0" width="1600" height="112" fill="url(#header)"/>
  <text x="70" y="54" class="title">Kernel Opt Skill 优化闭环</text>
  <text x="70" y="84" class="subtitle">以 last_accepted_kernel 为唯一基线，以官方 e2e wall time 采纳、以运行时证据指导优化</text>

  <text x="70" y="160" class="section">主流程：一轮优化 Round N</text>

  <!-- Main flow boxes -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="150" rx="14" fill="#e7f0f7" stroke="#83a9bf" stroke-width="2"/>
    <rect x="370" y="190" width="250" height="150" rx="14" fill="#eaf5ef" stroke="#82b99d" stroke-width="2"/>
    <rect x="670" y="190" width="250" height="150" rx="14" fill="#fff4df" stroke="#d7ae68" stroke-width="2"/>
    <rect x="970" y="190" width="250" height="150" rx="14" fill="#f7eafa" stroke="#b58bc8" stroke-width="2"/>
    <rect x="1270" y="190" width="260" height="150" rx="14" fill="#e8f3f3" stroke="#72aeb1" stroke-width="2"/>
  </g>

  <text x="95" y="225" class="box-title">Phase 0 初始化</text>
  <text x="95" y="257" class="box-text"><tspan x="95" dy="0">解析 base.py / harness</tspan><tspan x="95" dy="24">发现 runtime + target profile</tspan><tspan x="95" dy="24">生成 baseline_adapter.py</tspan><tspan x="95" dy="24">建立 measurement fingerprint</tspan></text>

  <text x="395" y="225" class="box-title">Designer</text>
  <text x="395" y="257" class="box-text"><tspan x="395" dy="0">读取 accepted kernel/report</tspan><tspan x="395" dy="24">判断 bottleneck</tspan><tspan x="395" dy="24">提出一个可证伪假设</tspan><tspan x="395" dy="24">写 decision_NNN.md</tspan></text>

  <text x="695" y="225" class="box-title">Decision Gate</text>
  <text x="695" y="257" class="box-text"><tspan x="695" dy="0">validate_decision.py</tspan><tspan x="695" dy="24">校验 schema / profile</tspan><tspan x="695" dy="24">检查 Sketch / Host Plan</tspan><tspan x="695" dy="24">Decision 验证后不可修改</tspan></text>

  <text x="995" y="225" class="box-title">Coder</text>
  <text x="995" y="257" class="box-text"><tspan x="995" dy="0">从 last_accepted_kernel 开始</tspan><tspan x="995" dy="24">按 Decision 实现候选</tspan><tspan x="995" dy="24">AST + harness loader</tspan><tspan x="995" dy="24">compile / warm-up smoke</tspan></text>

  <text x="1295" y="225" class="box-title">Verifier</text>
  <text x="1295" y="257" class="box-text"><tspan x="1295" dy="0">正确性优先</tspan><tspan x="1295" dy="24">两组快速筛选</tspan><tspan x="1295" dy="24">三组权威交错 timing</tspan><tspan x="1295" dy="24">Profiler + hypothesis verdict</tspan></text>

  <!-- Main arrows -->
  <line x1="320" y1="265" x2="365" y2="265" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="265" x2="665" y2="265" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="265" x2="965" y2="265" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1220" y1="265" x2="1265" y2="265" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Repair and failure paths -->
  <path d="M 1095 340 L 1095 405 L 875 405 L 875 345" fill="none" stroke="#b54747" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="930" y="395" class="label">实现缺陷：最多一次同轮修复</text>

  <path d="M 795 190 L 795 145 L 470 145 L 470 185" fill="none" stroke="#b54747" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="555" y="137" class="label">abort / design-rejected：进入下一轮重新设计</text>

  <!-- Orchestrator -->
  <g filter="url(#shadow)">
    <rect x="970" y="465" width="300" height="155" rx="14" fill="#dcebed" stroke="#4f9296" stroke-width="2.5"/>
  </g>
  <text x="1000" y="503" class="box-title">Orchestrator</text>
  <text x="1000" y="535" class="box-text"><tspan x="1000" dy="0">校验所有 Artifact 和 hash</tspan><tspan x="1000" dy="24">更新 team-state.md</tspan><tspan x="1000" dy="24">推进 canonical pointer</tspan><tspan x="1000" dy="24">Git commit terminal round</tspan></text>
  <path d="M 1400 340 L 1400 430 L 1120 430 L 1120 460" fill="none" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1280" y="420" class="label">report_NNN.md</text>

  <!-- Policy -->
  <g filter="url(#shadow)">
    <rect x="520" y="700" width="560" height="140" rx="14" fill="#173b51"/>
  </g>
  <text x="550" y="740" class="rule-title">evaluate_run_policy.py</text>
  <text x="550" y="773" class="rule-text"><tspan x="550" dy="0">accepted / no-improvement / screened-out / failed</tspan><tspan x="550" dy="25">更新轮次、miss streak、failed streak 和 stop reason</tspan></text>
  <path d="M 1120 620 L 1120 670 L 1080 670 L 1080 695" fill="none" stroke="#315a72" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Continuation -->
  <g filter="url(#shadow)">
    <rect x="90" y="900" width="380" height="120" rx="14" fill="#eaf5ef" stroke="#82b99d" stroke-width="2"/>
    <rect x="610" y="900" width="380" height="120" rx="14" fill="#fff0f0" stroke="#d58b8b" stroke-width="2"/>
    <rect x="1130" y="900" width="380" height="120" rx="14" fill="#fff7e6" stroke="#d8b66c" stroke-width="2"/>
  </g>
  <text x="120" y="937" class="box-title">继续运行</text>
  <text x="120" y="970" class="box-text"><tspan x="120" dy="0">workflow_status = running</tspan><tspan x="120" dy="24">可选 checkpoint，进入下一轮 Designer</tspan></text>

  <text x="640" y="937" class="stop-title">停止</text>
  <text x="640" y="970" class="stop-text"><tspan x="640" dy="0">user stop / target reached</tspan><tspan x="640" dy="24">3 次有效 no-improvement / 20 轮预算</tspan></text>

  <text x="1160" y="937" class="box-title">Blocked / Recovery</text>
  <text x="1160" y="970" class="box-text"><tspan x="1160" dy="0">记录 incident，计数器不变</tspan><tspan x="1160" dy="24">修复环境后从安全步骤恢复</tspan></text>

  <path d="M 700 840 L 280 895" fill="none" stroke="#247a5a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M 800 840 L 800 895" fill="none" stroke="#b54747" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M 900 840 L 1320 895" fill="none" stroke="#c28b2d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Canonical rule panel -->
  <rect x="70" y="465" width="780" height="155" rx="14" fill="#ffffff" stroke="#c4d2db" stroke-width="2"/>
  <text x="100" y="503" class="section">两条核心规则</text>
  <circle cx="112" cy="542" r="7" fill="#247a5a"/>
  <text x="135" y="548" class="box-text">只有 accepted 才更新 last_accepted_kernel / last_accepted_report</text>
  <circle cx="112" cy="582" r="7" fill="#247a5a"/>
  <text x="135" y="588" class="box-text">官方 e2e wall time 决定采用；kernel time、kernel count 与 host overhead 指导优化</text>

  <!-- Footer -->
  <text x="70" y="1070" class="small">角色边界：Designer 设计 · Coder 实现 · Verifier 测量 · Orchestrator 路由、状态和提交</text>
</svg>
