<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Triton 算子优化闭环</title>
  <desc id="desc">展示初始化、Designer、方案校验、Coder、Verifier、结果采用和继续停止恢复路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#123a56"/>
      <stop offset="1" stop-color="#176b73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#416b7d"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2f8668"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#b75b58"/>
    </marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceff1}
      .section{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .box-title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .box-text{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#365466}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#597385}
      .label{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#416b7d}
      .white-title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .white-text{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#e8f5f6}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="118" fill="url(#header)"/>
  <text x="70" y="55" class="title">Triton 算子优化闭环</text>
  <text x="70" y="88" class="subtitle">正确性是前提 · 端到端耗时决定采用 · Profiler 证据指导下一轮</text>

  <text x="70" y="165" class="section">初始化：固定可比较的评测基础</text>
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="1460" height="105" rx="16" fill="#ffffff" stroke="#b7ccd7" stroke-width="2"/>
  </g>
  <text x="105" y="230" class="box-title">Phase 0</text>
  <text x="240" y="230" class="box-text">参考实现与评测脚本</text>
  <text x="510" y="230" class="box-text">目标后端与能力范围</text>
  <text x="790" y="230" class="box-text">正确性与性能基线</text>
  <text x="1060" y="230" class="box-text">统一测量配置</text>
  <line x1="225" y1="245" x2="225" y2="265" stroke="#6d8794" stroke-width="2"/>
  <line x1="495" y1="245" x2="495" y2="265" stroke="#6d8794" stroke-width="2"/>
  <line x1="775" y1="245" x2="775" y2="265" stroke="#6d8794" stroke-width="2"/>
  <line x1="1045" y1="245" x2="1045" y2="265" stroke="#6d8794" stroke-width="2"/>
  <text x="105" y="274" class="small">保持语义不变</text>
  <text x="375" y="274" class="small">选择匹配 profile</text>
  <text x="655" y="274" class="small">建立可复现基准</text>
  <text x="925" y="274" class="small">保证结果可比较</text>

  <text x="70" y="350" class="section">Round N：设计、实现、验证</text>
  <g filter="url(#shadow)">
    <rect x="70" y="385" width="260" height="170" rx="16" fill="#e8f2f8" stroke="#84acc0" stroke-width="2"/>
    <rect x="385" y="385" width="260" height="170" rx="16" fill="#edf6f0" stroke="#88b99e" stroke-width="2"/>
    <rect x="700" y="385" width="260" height="170" rx="16" fill="#fff5e2" stroke="#d7b36c" stroke-width="2"/>
    <rect x="1015" y="385" width="260" height="170" rx="16" fill="#f5ebf8" stroke="#b792c6" stroke-width="2"/>
    <rect x="1330" y="385" width="200" height="170" rx="16" fill="#e8f4f3" stroke="#76afb0" stroke-width="2"/>
  </g>

  <text x="100" y="425" class="box-title">Designer</text>
  <text x="100" y="458" class="box-text"><tspan x="100" dy="0">读取最佳实现与证据</tspan><tspan x="100" dy="25">判断主要瓶颈</tspan><tspan x="100" dy="25">提出一个可验证假设</tspan><tspan x="100" dy="25">定义预期改进机制</tspan></text>

  <text x="415" y="425" class="box-title">方案校验</text>
  <text x="415" y="458" class="box-text"><tspan x="415" dy="0">语义与边界条件</tspan><tspan x="415" dy="25">Unified Sketch</tspan><tspan x="415" dy="25">目标后端能力</tspan><tspan x="415" dy="25">Evaluation Contract</tspan></text>

  <text x="730" y="425" class="box-title">Coder</text>
  <text x="730" y="458" class="box-text"><tspan x="730" dy="0">实现 Triton 候选</tspan><tspan x="730" dy="25">保持公共接口不变</tspan><tspan x="730" dy="25">完成语法与编译冒烟</tspan><tspan x="730" dy="25">记录实现偏差</tspan></text>

  <text x="1045" y="425" class="box-title">Verifier</text>
  <text x="1045" y="458" class="box-text"><tspan x="1045" dy="0">正确性验证</tspan><tspan x="1045" dy="25">交错端到端计时</tspan><tspan x="1045" dy="25">Profiler 机制验证</tspan><tspan x="1045" dy="25">给出可归因结论</tspan></text>

  <text x="1360" y="425" class="box-title">Orchestrator</text>
  <text x="1360" y="458" class="box-text"><tspan x="1360" dy="0">校验交付物</tspan><tspan x="1360" dy="25">记录终态</tspan><tspan x="1360" dy="25">更新最佳实现</tspan><tspan x="1360" dy="25">提交证据</tspan></text>

  <line x1="330" y1="470" x2="380" y2="470" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="645" y1="470" x2="695" y2="470" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="960" y1="470" x2="1010" y2="470" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1275" y1="470" x2="1325" y2="470" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1145 555 L1145 615 L830 615 L830 560" fill="none" stroke="#b75b58" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="895" y="605" class="label">局部实现缺陷：同轮最多修复一次</text>

  <g filter="url(#shadow)">
    <rect x="300" y="680" width="1000" height="120" rx="18" fill="#173f55"/>
  </g>
  <text x="345" y="720" class="white-title">结果采用与运行策略</text>
  <text x="345" y="755" class="white-text">正确性通过且端到端改进达到阈值 → 采用候选；否则保留当前最佳实现与本轮证据</text>
  <text x="345" y="782" class="white-text">根据轮次、连续无提升、用户目标和环境状态决定继续、停止或恢复</text>
  <path d="M1430 555 L1430 640 L1300 640 L1300 675" fill="none" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="860" width="380" height="92" rx="15" fill="#eaf6ef" stroke="#84b99e" stroke-width="2"/>
    <rect x="610" y="860" width="380" height="92" rx="15" fill="#fff0ef" stroke="#d58e89" stroke-width="2"/>
    <rect x="1130" y="860" width="380" height="92" rx="15" fill="#fff7e7" stroke="#d7b66f" stroke-width="2"/>
  </g>
  <text x="120" y="898" class="box-title">继续下一轮</text>
  <text x="120" y="927" class="box-text">携带最新证据返回 Designer</text>
  <text x="640" y="898" class="box-title">完成并停止</text>
  <text x="640" y="927" class="box-text">输出最佳实现与最终测量结果</text>
  <text x="1160" y="898" class="box-title">环境阻塞与恢复</text>
  <text x="1160" y="927" class="box-text">记录原因，修复后从安全步骤继续</text>

  <path d="M520 800 L280 855" fill="none" stroke="#2f8668" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M800 800 L800 855" fill="none" stroke="#b75b58" stroke-width="3" marker-end="url(#arrow-red)"/>
  <path d="M1080 800 L1320 855" fill="none" stroke="#b28a36" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
