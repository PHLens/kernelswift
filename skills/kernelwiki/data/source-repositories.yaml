schema_version: 1
repositories:
  - id: triton-ascend
    host: github
    repo: Ascend/triton-ascend
    lane: ascend-native
    languages: [triton, python, cpp]
    target_families: [ascend]
    kernel_path_globs: ["**/ops/**", "**/kernels/**", "**/*ascendc*"]
    skip_path_globs: ["**/docs/**", "**/tests/**", "**/benchmarks/**"]
    search_terms: [AscendC, kernel, performance, fused, topk, attention, reduction, tiling, double buffer]
