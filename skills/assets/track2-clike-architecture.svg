<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">赛道二 C-like Skill 架构</title>
  <desc id="desc">展示 kernel-opt-loop 如何通过 implementation profile、candidate manifest、build adapter、native runner 和 profiler adapter 支持赛道二 C-like 算子。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef5f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143a57"/>
      <stop offset="1" stop-color="#176d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#416b7d"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2f8668"/>
    </marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceff1}
      .section{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .box-title{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .box-text{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#365466}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#587385}
      .white-title{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .white-text{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#e8f5f6}
      .label{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#416b7d}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="118" fill="url(#header)"/>
  <text x="70" y="55" class="title">赛道二 C-like Skill 架构</text>
  <text x="70" y="88" class="subtitle">复用统一优化闭环 · 新增原生构建、ABI、运行与设备证据适配层</text>

  <text x="70" y="165" class="section">可复用的语言无关核心</text>
  <g filter="url(#shadow)">
    <rect x="70" y="195" width="1460" height="145" rx="18" fill="#ffffff" stroke="#b7ccd7" stroke-width="2"/>
  </g>
  <rect x="105" y="225" width="235" height="82" rx="14" fill="#e8f2f8" stroke="#83a9bf" stroke-width="2"/>
  <rect x="395" y="225" width="235" height="82" rx="14" fill="#eef7f1" stroke="#83b79a" stroke-width="2"/>
  <rect x="685" y="225" width="235" height="82" rx="14" fill="#fff5e3" stroke="#d6b06a" stroke-width="2"/>
  <rect x="975" y="225" width="235" height="82" rx="14" fill="#f5ebf8" stroke="#b690c5" stroke-width="2"/>
  <rect x="1265" y="225" width="230" height="82" rx="14" fill="#e8f4f3" stroke="#76afb0" stroke-width="2"/>
  <text x="140" y="260" class="box-title">Designer</text><text x="140" y="287" class="small">假设 · Unified Sketch</text>
  <text x="430" y="260" class="box-title">方案校验</text><text x="430" y="287" class="small">语义 · 能力 · 指标</text>
  <text x="720" y="260" class="box-title">Coder</text><text x="720" y="287" class="small">实现目标语言候选</text>
  <text x="1010" y="260" class="box-title">Verifier</text><text x="1010" y="287" class="small">正确性 · 性能 · 证据</text>
  <text x="1300" y="260" class="box-title">Orchestrator</text><text x="1300" y="287" class="small">状态 · 采用 · 恢复</text>
  <line x1="340" y1="266" x2="390" y2="266" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="630" y1="266" x2="680" y2="266" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="266" x2="970" y2="266" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1210" y1="266" x2="1260" y2="266" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="405" class="section">赛道二新增的实现适配层</text>
  <g filter="url(#shadow)">
    <rect x="70" y="440" width="350" height="245" rx="18" fill="#eef5fa" stroke="#84abc0" stroke-width="2"/>
    <rect x="440" y="440" width="350" height="245" rx="18" fill="#eef8f1" stroke="#87b99d" stroke-width="2"/>
    <rect x="810" y="440" width="350" height="245" rx="18" fill="#fff6e6" stroke="#d7b36c" stroke-width="2"/>
    <rect x="1180" y="440" width="350" height="245" rx="18" fill="#f5edf8" stroke="#b895c7" stroke-width="2"/>
  </g>

  <text x="100" y="482" class="box-title">Implementation Profile</text>
  <text x="100" y="518" class="box-text"><tspan x="100" dy="0">• language / backend</tspan><tspan x="100" dy="27">• compiler / SDK / arch</tspan><tspan x="100" dy="27">• memory 与 intrinsic 能力</tspan><tspan x="100" dy="27">• submission ABI</tspan><tspan x="100" dy="27">• 已验证的构建与运行约束</tspan></text>

  <text x="470" y="482" class="box-title">Candidate Manifest v2</text>
  <text x="470" y="518" class="box-text"><tspan x="470" dy="0">• 多个 kernel / host 源文件</tspan><tspan x="470" dy="27">• 文件 SHA-256 集合</tspan><tspan x="470" dy="27">• 构建命令与编译参数</tspan><tspan x="470" dy="27">• ABI、入口和产物哈希</tspan><tspan x="470" dy="27">• 编译日志与复现命令</tspan></text>

  <text x="840" y="482" class="box-title">Build + Native Runner</text>
  <text x="840" y="518" class="box-text"><tspan x="840" dy="0">• configure / compile / link</tspan><tspan x="840" dy="27">• shared library 或 executable</tspan><tspan x="840" dy="27">• 参数、workspace、stream 传递</tspan><tspan x="840" dy="27">• correctness 与 wall-time</tspan><tspan x="840" dy="27">• 编译时间与测量边界隔离</tspan></text>

  <text x="1210" y="482" class="box-title">Profiler Adapter</text>
  <text x="1210" y="518" class="box-text"><tspan x="1210" dy="0">• 官方 device timer</tspan><tspan x="1210" dy="27">• reference / candidate 分 scope</tspan><tspan x="1210" dy="27">• 每次 forward 归一化</tspan><tspan x="1210" dy="27">• kernel / DMA / host 归因</tspan><tspan x="1210" dy="27">• 环境缺失不冒充性能结果</tspan></text>

  <path d="M245 685 L245 735" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M615 685 L615 735" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M985 685 L985 735" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1355 685 L1355 735" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="110" y="750" width="1380" height="150" rx="20" fill="#173f55"/>
  </g>
  <text x="155" y="795" class="white-title">正式评测路径</text>
  <text x="155" y="832" class="white-text">PyTorch reference + 官方规则 → Native candidate build → 官方 ABI 调用 → 正确性 → 交错端到端计时 → 设备 profiler</text>
  <text x="155" y="865" class="white-text">只有 correctness-PASS 且 wall-time 达到采用阈值的 candidate manifest 才更新当前最佳实现</text>

  <rect x="250" y="925" width="1100" height="48" rx="12" fill="#eaf6ef" stroke="#83b99d" stroke-width="2"/>
  <text x="355" y="956" class="box-text">首个 profile：ascendc　·　首个基础设施验证算子：sinkhorn_normalize</text>
</svg>
