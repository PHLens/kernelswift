<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">赛道二 C-like 实施路线</title>
  <desc id="desc">展示从官方规则确认、候选 manifest、native runner、Ascend C profile 到三个赛题依次接入的里程碑。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#edf5f6"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143a57"/>
      <stop offset="1" stop-color="#176d72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#416b7d"/>
    </marker>
    <style>
      .title{font:700 38px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#dceff1}
      .section{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .phase{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .box-title{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}
      .box-text{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#365466}
      .small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#587385}
      .warn{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#8b4a45}
      .num{font:800 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="118" fill="url(#header)"/>
  <text x="70" y="55" class="title">赛道二 C-like 实施路线</text>
  <text x="70" y="88" class="subtitle">先确认官方契约和原生基础设施，再按复杂度接入三个算子</text>

  <rect x="170" y="150" width="1260" height="58" rx="14" fill="#fff0ef" stroke="#d58e89" stroke-width="2"/>
  <text x="320" y="187" class="warn">M0 未完成前，不启动正式 Ascend C 优化轮次，也不从赛道一推断 ABI、计时或允许的库调用</text>

  <text x="70" y="260" class="section">基础设施阶段</text>
  <line x1="160" y1="385" x2="1440" y2="385" stroke="#8aa5b2" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="80" y="300" width="270" height="170" rx="17" fill="#e8f2f8" stroke="#83a9bf" stroke-width="2"/>
    <rect x="385" y="300" width="270" height="170" rx="17" fill="#eef7f1" stroke="#83b79a" stroke-width="2"/>
    <rect x="690" y="300" width="270" height="170" rx="17" fill="#fff5e3" stroke="#d6b06a" stroke-width="2"/>
    <rect x="995" y="300" width="270" height="170" rx="17" fill="#f5ebf8" stroke="#b690c5" stroke-width="2"/>
    <rect x="1300" y="300" width="220" height="170" rx="17" fill="#e8f4f3" stroke="#76afb0" stroke-width="2"/>
  </g>

  <circle cx="125" cy="335" r="25" fill="#3d7b9c"/><text x="108" y="344" class="num">M0</text>
  <text x="165" y="340" class="box-title">官方规则确认</text>
  <text x="110" y="380" class="box-text"><tspan x="110" dy="0">语言 / 芯片 / ABI</tspan><tspan x="110" dy="25">构建与允许库</tspan><tspan x="110" dy="25">正确性与计时口径</tspan><tspan x="110" dy="25">提交和防作弊规则</tspan></text>

  <circle cx="430" cy="335" r="25" fill="#3b8b67"/><text x="413" y="344" class="num">M1</text>
  <text x="470" y="340" class="box-title">Candidate Manifest v2</text>
  <text x="415" y="380" class="box-text"><tspan x="415" dy="0">多文件 source set</tspan><tspan x="415" dy="25">构建命令与产物</tspan><tspan x="415" dy="25">ABI 与入口</tspan><tspan x="415" dy="25">哈希和复现记录</tspan></text>

  <circle cx="735" cy="335" r="25" fill="#c08b31"/><text x="718" y="344" class="num">M2</text>
  <text x="775" y="340" class="box-title">Native Runner</text>
  <text x="720" y="380" class="box-text"><tspan x="720" dy="0">compile / link / load</tspan><tspan x="720" dy="25">输入与参数传递</tspan><tspan x="720" dy="25">correctness / timing</tspan><tspan x="720" dy="25">错误与资源清理</tspan></text>

  <circle cx="1040" cy="335" r="25" fill="#8d68a1"/><text x="1023" y="344" class="num">M3</text>
  <text x="1080" y="340" class="box-title">ascendc Profile</text>
  <text x="1025" y="380" class="box-text"><tspan x="1025" dy="0">CANN / Ascend C / SoC</tspan><tspan x="1025" dy="25">memory / DMA / intrinsic</tspan><tspan x="1025" dy="25">device timer / profiler</tspan><tspan x="1025" dy="25">目标 Ascend probe</tspan></text>

  <circle cx="1345" cy="335" r="25" fill="#397f83"/><text x="1328" y="344" class="num">M4</text>
  <text x="1385" y="340" class="box-title">Pilot</text>
  <text x="1330" y="380" class="box-text"><tspan x="1330" dy="0">完整跑通</tspan><tspan x="1330" dy="25">一个正式 round</tspan><tspan x="1330" dy="25">采用与恢复</tspan></text>

  <text x="70" y="545" class="section">算子接入顺序</text>
  <g filter="url(#shadow)">
    <rect x="90" y="585" width="430" height="245" rx="20" fill="#eef8f1" stroke="#83b79a" stroke-width="2"/>
    <rect x="585" y="585" width="430" height="245" rx="20" fill="#eef5fa" stroke="#83a9bf" stroke-width="2"/>
    <rect x="1080" y="585" width="430" height="245" rx="20" fill="#fff5e3" stroke="#d6b06a" stroke-width="2"/>
  </g>

  <rect x="120" y="615" width="92" height="36" rx="10" fill="#3b8b67"/><text x="143" y="639" class="phase">第一步</text>
  <text x="120" y="690" class="box-title">sinkhorn_normalize</text>
  <text x="120" y="725" class="box-text"><tspan x="120" dy="0">• 单输入单输出、无参数</tspan><tspan x="120" dy="27">• 固定 4×4 小矩阵</tspan><tspan x="120" dy="27">• 验证 build / ABI / runner</tspan><tspan x="120" dy="27">• 目标：打通完整闭环</tspan></text>

  <rect x="615" y="615" width="92" height="36" rx="10" fill="#3d7b9c"/><text x="638" y="639" class="phase">第二步</text>
  <text x="615" y="690" class="box-title">sparse_attn</text>
  <text x="615" y="725" class="box-text"><tspan x="615" dy="0">• 大规模 bf16 输入</tspan><tspan x="615" dy="27">• gather 与 -1 无效索引</tspan><tspan x="615" dy="27">• online softmax + sink</tspan><tspan x="615" dy="27">• 验证 DMA 与多级 tiling</tspan></text>

  <rect x="1110" y="615" width="92" height="36" rx="10" fill="#c08b31"/><text x="1133" y="639" class="phase">第三步</text>
  <text x="1110" y="690" class="box-title">index_topk</text>
  <text x="1110" y="725" class="box-text"><tspan x="1110" dy="0">• 参数化 GEMM 与 RoPE</tspan><tspan x="1110" dy="27">• 压缩 KV 与因果 mask</tspan><tspan x="1110" dy="27">• 归约和 top-k 语义</tspan><tspan x="1110" dy="27">• 最后验证多 kernel 契约</tspan></text>

  <line x1="520" y1="707" x2="580" y2="707" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1015" y1="707" x2="1075" y2="707" stroke="#416b7d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="190" y="875" width="1220" height="55" rx="14" fill="#173f55"/>
  <text x="305" y="910" class="phase">完成标准：规则明确 · 原生候选可复现构建 · 正确性可验证 · wall-time 可比较 · profiler 可归因</text>
</svg>
